name: Windows 빌드 (exe + 설치 파일)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 정하기
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "1.0.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 문법 검사
        run: python -m py_compile school_widget.py

      - name: PyInstaller 설치
        run: python -m pip install --upgrade pip pyinstaller

      - name: 단일 실행 파일 (설치 없이 실행용)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SchoolWidget --icon assets\icon.ico school_widget.py

      - name: 폴더형 실행 파일 (설치 파일용)
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SchoolWidget --icon assets\icon.ico --distpath build_onedir school_widget.py

      - name: 실행 확인 (5초 동안 켜졌다가 종료)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build_onedir\SchoolWidget\SchoolWidget.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Write-Error "프로그램이 바로 종료되었습니다 (exit $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Inno Setup 설치
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\SchoolWidget.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\SchoolWidget.exe "dist_installer\SchoolWidget-Portable-${{ steps.ver.outputs.version }}.exe"
          Get-ChildItem dist_installer

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolWidget-${{ steps.ver.outputs.version }}
          path: dist_installer\*.exe

      - name: 릴리스에 올리기 (v 태그를 푸시했을 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
          generate_release_notes: true
